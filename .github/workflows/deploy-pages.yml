name: Deploy FlightLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: flightlab-github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test decoder and analysis
        run: npm test
      - name: Build site and corresponding source
        run: npm run build:pages
      - name: Publish generated site to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: gh-pages
          folder: dist-offline
          clean: true
          single-commit: false
      - name: Request a Pages build when Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          else
            echo "::notice::Site files are on gh-pages. Enable Settings > Pages > Deploy from a branch > gh-pages > / (root)."
          fi
